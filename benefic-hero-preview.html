<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benefic Cars</title>
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    body { background: #fff; font-family: 'General Sans', sans-serif; overflow-x: hidden; }

    /* ========== LOADER ========== */
    .loader {
      position: fixed; inset: 0; z-index: 9999; background: #1a1f3d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .loader.done { opacity: 0; pointer-events: none; }
    .loader-logo {
      font-family: 'Clash Display', sans-serif; font-weight: 600;
      font-size: 0.85rem; color: rgba(255,255,255,0.4); letter-spacing: 0.35em;
      text-transform: uppercase; margin-bottom: 2.5rem;
    }
    .loader-ring {
      width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.08);
      border-top-color: rgba(139,111,138,0.6); border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-pct {
      margin-top: 1.5rem; font-size: 0.65rem; color: rgba(255,255,255,0.25);
      letter-spacing: 0.2em; font-variant-numeric: tabular-nums;
    }

    /* ========== SCROLL CONTAINER ========== */
    .scroll-container { position: relative; height: 400vh; }
    .sticky-viewport {
      position: sticky; top: 0; width: 100%; height: 100vh;
      overflow: hidden; background: #fff;
    }
    .sticky-viewport canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }

    /* ========== GRADIENT OVERLAYS FOR TEXT CONTRAST ========== */
    .gradient-top {
      position: absolute; top: 0; left: 0; right: 0; height: 35vh; z-index: 3;
      background: linear-gradient(to bottom, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
      pointer-events: none;
    }
    .gradient-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; height: 50vh; z-index: 3;
      background: linear-gradient(to top, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.5) 40%, transparent 100%);
      pointer-events: none;
    }

    /* ========== NAVBAR ========== */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 3rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      opacity: 0; transition: opacity 0.8s ease, background 0.4s ease, box-shadow 0.4s ease;
    }
    .top-nav.show { opacity: 1; }
    .top-nav.scrolled {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 1px 0 rgba(26,31,61,0.06);
    }
    .nav-logo {
      font-family: 'Clash Display', sans-serif; font-weight: 700;
      font-size: 1rem; color: #1a1f3d; letter-spacing: 0.12em;
      text-transform: uppercase; text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a {
      font-size: 0.8rem; font-weight: 500; color: #1a1f3d;
      text-decoration: none; opacity: 0.5; transition: opacity 0.3s;
    }
    .nav-links a:hover { opacity: 1; }
    .nav-cta {
      font-family: 'Clash Display', sans-serif; font-size: 0.75rem; font-weight: 600;
      color: #fff; background: #1a1f3d; padding: 0.5rem 1.4rem;
      border-radius: 100px; text-decoration: none; letter-spacing: 0.04em;
      transition: background 0.3s, transform 0.3s;
    }
    .nav-cta:hover { background: #252b54; transform: scale(1.03); }

    /* ========== HERO TEXT — DIRECT ON VIDEO ========== */
    .hero-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 10; pointer-events: none;
      padding: 0 2rem 4rem;
      display: flex; flex-direction: column; align-items: center;
    }

    .hero-eyebrow {
      font-family: 'General Sans', sans-serif;
      font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: #8b6f8a;
      opacity: 0; transform: translateY(16px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-eyebrow.show { opacity: 1; transform: translateY(0); }

    .hero-title {
      font-family: 'Clash Display', sans-serif;
      font-weight: 700; color: #1a1f3d;
      font-size: clamp(2.4rem, 7vw, 5rem);
      text-align: center; line-height: 1.05;
      letter-spacing: -0.03em;
      margin-top: 0.8rem;
      text-shadow: 0 2px 20px rgba(255,255,255,0.8),
                   0 0 60px rgba(255,255,255,0.5);
    }
    .hero-title .line { display: block; overflow: hidden; }
    .hero-title .word {
      display: inline-block;
      opacity: 0; transform: translateY(105%);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-title .word.show { opacity: 1; transform: translateY(0); }

    .hero-divider {
      width: 40px; height: 2px; background: #8b6f8a;
      margin: 1.2rem 0; border-radius: 2px;
      opacity: 0; transform: scaleX(0);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-divider.show { opacity: 1; transform: scaleX(1); }

    .hero-sub {
      font-family: 'General Sans', sans-serif;
      color: #4a5296; font-size: clamp(0.85rem, 2vw, 1.05rem);
      font-weight: 500; text-align: center;
      letter-spacing: 0.015em;
      text-shadow: 0 1px 12px rgba(255,255,255,0.9);
      opacity: 0; transform: translateY(14px);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-sub.show { opacity: 1; transform: translateY(0); }

    .hero-ctas {
      display: flex; gap: 0.7rem; margin-top: 1.6rem;
      opacity: 0; transform: translateY(14px);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-ctas.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .cta-primary {
      font-family: 'Clash Display', sans-serif;
      padding: 0.8rem 2rem; font-size: 0.85rem; font-weight: 600;
      background: #1a1f3d; color: #fff; border: none; border-radius: 100px;
      cursor: pointer; letter-spacing: 0.03em; pointer-events: auto;
      box-shadow: 0 4px 20px rgba(26,31,61,0.2);
      transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .cta-primary:hover {
      background: #252b54; transform: scale(1.04);
      box-shadow: 0 6px 30px rgba(26,31,61,0.3);
    }

    .cta-secondary {
      font-family: 'Clash Display', sans-serif;
      padding: 0.8rem 2rem; font-size: 0.85rem; font-weight: 600;
      background: rgba(255,255,255,0.7); color: #1a1f3d;
      border: 1.5px solid rgba(26,31,61,0.15); border-radius: 100px;
      cursor: pointer; letter-spacing: 0.03em; pointer-events: auto;
      backdrop-filter: blur(8px);
      transition: background 0.3s, border-color 0.3s;
    }
    .cta-secondary:hover {
      background: rgba(255,255,255,0.9); border-color: rgba(26,31,61,0.3);
    }

    /* ========== SCROLL CUE ========== */
    .scroll-cue {
      position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
      opacity: 0; transition: opacity 0.8s ease;
    }
    .scroll-cue.show { opacity: 1; }
    .scroll-cue p {
      color: #8d94c9; font-size: 0.58rem; font-weight: 500;
      letter-spacing: 0.35em; text-transform: uppercase;
    }
    .scroll-cue .pip {
      width: 2px; height: 24px; border-radius: 2px;
      background: linear-gradient(to bottom, #8b6f8a, transparent);
      animation: pipDrop 1.8s ease-in-out infinite;
    }
    @keyframes pipDrop {
      0% { opacity: 0; transform: translateY(-6px); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translateY(10px); }
    }

    /* ========== NEXT SECTION ========== */
    .next-section {
      min-height: 100vh; background: #fafafa;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.5rem;
    }
    .next-section p {
      font-family: 'Clash Display', sans-serif;
      color: #1a1f3d; font-size: 1.2rem; opacity: 0.12; font-weight: 600;
    }

    /* ========== DEBUG ========== */
    .debug {
      position: fixed; bottom: 0.8rem; right: 0.8rem; z-index: 9000;
      background: rgba(26,31,61,0.9); backdrop-filter: blur(10px);
      padding: 0.6rem 1rem; border-radius: 8px;
      font-size: 0.65rem; color: rgba(255,255,255,0.45);
      display: flex; gap: 1rem; align-items: center;
      border: 1px solid rgba(139,111,138,0.15);
      font-family: monospace;
    }
    .debug .v { color: #fff; }

    /* ========== MOBILE FIRST ========== */
    @media (max-width: 767px) {
      .top-nav { padding: 0 1.2rem; height: 56px; }
      .nav-links { display: none; }
      .nav-cta { font-size: 0.7rem; padding: 0.45rem 1.1rem; }

      .hero-content { padding: 0 1.2rem 3rem; }
      .hero-title { font-size: clamp(2rem, 10vw, 3rem); }
      .hero-sub { font-size: 0.82rem; max-width: 85vw; }

      .hero-ctas { flex-direction: column; width: 100%; max-width: 300px; }
      .cta-primary, .cta-secondary {
        width: 100%; text-align: center;
        padding: 0.85rem 1.5rem; font-size: 0.82rem;
      }

      .gradient-bottom { height: 65vh; }

      .scroll-cue { bottom: 1rem; }
      .debug { display: none; }
    }

    @media (min-width: 768px) and (max-width: 1023px) {
      .hero-content { padding: 0 2rem 3.5rem; }
      .nav-links { gap: 1.5rem; }
      .nav-links a { font-size: 0.75rem; }
    }

    @media (min-width: 1024px) {
      .hero-content { padding: 0 3rem 5rem; }
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div class="loader" id="loader">
    <div class="loader-logo">Benefic Cars</div>
    <div class="loader-ring"></div>
    <div class="loader-pct" id="loaderPct">0%</div>
  </div>

  <!-- Navbar -->
  <nav class="top-nav" id="topNav">
    <a href="#" class="nav-logo">Benefic Cars</a>
    <ul class="nav-links">
      <li><a href="#">Mașini</a></li>
      <li><a href="#">Finanțare</a></li>
      <li><a href="#">Garanție</a></li>
      <li><a href="#">Servicii</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <a href="#" class="nav-cta">Vezi Stocul</a>
  </nav>

  <!-- Hero -->
  <div class="scroll-container" id="scrollContainer">
    <div class="sticky-viewport">
      <canvas id="canvas"></canvas>
      <div class="gradient-top"></div>
      <div class="gradient-bottom" id="gradientBottom"></div>

      <div class="hero-content" id="heroContent">
        <h1 class="hero-title">
          <span class="line" id="line1"></span>
          <span class="line" id="line2"></span>
        </h1>
        <div class="hero-ctas" id="ctas">
          <button class="cta-primary">Explorează Ofertele</button>
          <button class="cta-secondary">Finanțare de la 0€</button>
        </div>
      </div>

      <div class="scroll-cue" id="scrollCue">
        <p>Scroll</p>
        <div class="pip"></div>
      </div>
    </div>
  </div>

  <!-- Next section placeholder -->
  <div class="next-section">
    <p>Continuă mai jos</p>
  </div>

  <!-- Debug -->
  <div class="debug">
    <span>Phase: <span class="v" id="dbgPhase">load</span></span>
    <span>Frame: <span class="v" id="dbgFrame">0</span>/192</span>
    <span>Scroll: <span class="v" id="dbgScroll">0%</span></span>
  </div>

  <script>
    // ==========================================
    //  CONFIG
    // ==========================================
    const FRAMES_FOLDER = './frames';
    const FRAME_PREFIX  = 'f_';
    const FRAME_EXT     = '.jpg';
    const TOTAL_FRAMES  = 192;
    const INTRO_END     = 55;
    const INTRO_MS      = 2000;       // slightly slower
    const LERP          = 0.18;

    // Soft ease-out (slow start, slower end — Apple feel)
    const ease = t => {
      // custom: fast middle, gentle start + end
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };

    // ==========================================
    //  FRAME URLS
    // ==========================================
    const URLS = [];
    for (let i = 1; i <= TOTAL_FRAMES; i++)
      URLS.push(`${FRAMES_FOLDER}/${FRAME_PREFIX}${String(i).padStart(3,'0')}${FRAME_EXT}`);

    // ==========================================
    //  DOM
    // ==========================================
    const $ = id => document.getElementById(id);
    const canvas      = $('canvas'), ctx = canvas.getContext('2d');
    const container   = $('scrollContainer');
    const loader      = $('loader');
    const loaderPct   = $('loaderPct');
    const topNav      = $('topNav');
    const heroContent = $('heroContent');
    const ctas        = $('ctas');
    const scrollCue   = $('scrollCue');
    const gradBottom  = $('gradientBottom');

    // Debug
    const dPhase = $('dbgPhase'), dFrame = $('dbgFrame'), dScroll = $('dbgScroll');

    // Build title words
    function buildLine(id, words, delay) {
      const el = $(id);
      words.forEach((w, i) => {
        const s = document.createElement('span');
        s.className = 'word';
        s.textContent = w;
        s.style.transitionDelay = `${delay + i * 0.08}s`;
        el.appendChild(s);
        if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
      });
    }
    buildLine('line1', ['Mașina', 'Ta', 'Perfectă'], 0);
    buildLine('line2', ['La', 'Cel', 'Mai', 'Bun', 'Preț'], 0.2);

    // ==========================================
    //  IMAGE PRELOAD
    // ==========================================
    const imgs = new Array(TOTAL_FRAMES);
    let loaded = 0, ready = false;
    let cur = 0, target = 0;
    let phase = 'loading', introT0 = 0;

    function preload() {
      URLS.forEach((url, i) => {
        const img = new Image();
        img.onload = img.onerror = () => {
          imgs[i] = img; loaded++;
          loaderPct.textContent = Math.round(loaded/TOTAL_FRAMES*100) + '%';
          if (loaded === TOTAL_FRAMES) {
            ready = true; resize(); draw(0);
            setTimeout(() => { loader.classList.add('done'); startIntro(); }, 500);
          }
        };
        img.src = url;
      });
    }

    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }

    function draw(idx) {
      idx = Math.max(0, Math.min(TOTAL_FRAMES-1, Math.round(idx)));
      const img = imgs[idx];
      if (!img) return;
      const cw = canvas.width, ch = canvas.height;
      const s = Math.max(cw/img.naturalWidth, ch/img.naturalHeight);
      const dw = img.naturalWidth*s, dh = img.naturalHeight*s;
      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, (cw-dw)/2, (ch-dh)/2, dw, dh);
    }

    // ==========================================
    //  INTRO (Apple style — slow, cinematic)
    // ==========================================
    function startIntro() {
      phase = 'intro'; introT0 = performance.now();
      dPhase.textContent = 'intro';
      document.body.style.overflow = 'hidden';

      // Stagger text reveals during intro
      setTimeout(() => topNav.classList.add('show'), 300);
      setTimeout(() => {
        document.querySelectorAll('.hero-title .word').forEach(w => w.classList.add('show'));
      }, 800);
      setTimeout(() => ctas.classList.add('show'), 1400);
    }

    function tickIntro(now) {
      const t = Math.min(1, (now - introT0) / INTRO_MS);
      cur = ease(t) * INTRO_END;
      draw(Math.round(cur));
      dFrame.textContent = Math.round(cur);

      if (t >= 1) {
        phase = 'scroll';
        dPhase.textContent = 'scroll';
        document.body.style.overflow = '';
        target = INTRO_END; cur = INTRO_END;
        setTimeout(() => scrollCue.classList.add('show'), 200);
      }
    }

    // ==========================================
    //  SCROLL
    // ==========================================
    function onScroll() {
      if (phase !== 'scroll') return;
      const rect = container.getBoundingClientRect();
      const scrollable = container.offsetHeight - innerHeight;
      if (scrollable <= 0) return;

      const p = Math.max(0, Math.min(1, -rect.top / scrollable));
      target = INTRO_END + p * (TOTAL_FRAMES - 1 - INTRO_END);

      dScroll.textContent = (p*100).toFixed(1) + '%';

      // Fade out text + gradient
      const textFade = p < 0.08 ? 1 : p < 0.22 ? 1 - (p - 0.08) / 0.14 : 0;
      heroContent.style.opacity = textFade;
      heroContent.style.transform = `translateY(${(1 - textFade) * -30}px)`;

      // Gradient bottom shrinks as we scroll
      gradBottom.style.opacity = textFade;

      // Scroll cue
      scrollCue.style.opacity = p < 0.03 ? '1' : '0';
      // Nav bg
      topNav.classList.toggle('scrolled', p > 0.05);
    }

    // ==========================================
    //  RENDER
    // ==========================================
    function tick(now) {
      if (phase === 'intro') {
        tickIntro(now);
      } else if (phase === 'scroll' && ready) {
        if (Math.abs(target - cur) > 0.08) {
          cur += (target - cur) * LERP;
          draw(Math.round(cur));
          dFrame.textContent = Math.round(cur);
        }
      }
      requestAnimationFrame(tick);
    }

    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', () => { resize(); draw(Math.round(cur)); });
    preload();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
